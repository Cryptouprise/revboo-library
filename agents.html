<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RevBoo · Creative catalog</title><style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#f5f5f6;font:16px system-ui}header{padding:36px max(22px,5vw);background:#181a20;border-bottom:1px solid #333}h1{font-size:36px;margin:8px 0}p{color:#babdc6;line-height:1.5}strong,.id{color:#ff8051}main{padding:24px max(22px,5vw)}.controls{display:flex;gap:10px;flex-wrap:wrap;position:sticky;top:0;background:#101114;padding:14px 0;z-index:1}input,select{padding:12px;border-radius:9px;border:1px solid #444;background:#20232a;color:white;font:inherit}input{flex:1;min-width:240px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}.card{padding:18px;border:1px solid #333740;border-radius:14px;background:#191c22}img{width:100%;height:200px;object-fit:contain;background:#0c0d10;border-radius:9px}h2{font-size:21px;margin:8px 0}.tag{font-size:12px;color:#b6becd}.note{font-size:14px}a{color:#7bdcd3}.button{display:inline-block;padding:10px;background:#ff5b1d;border-radius:6px;color:#fff;text-decoration:none;margin:8px 0}details{margin-top:10px;font-size:13px;color:#bac0cb;overflow-wrap:anywhere}#count{margin:10px 0 22px}.hint{border-left:3px solid #ff5b1d;padding-left:16px}video{width:100%;max-height:75vh}dialog{background:#15171c;color:white;border:1px solid #555;border-radius:12px;max-width:650px;width:90%}button{cursor:pointer;padding:10px;background:#ff5b1d;color:white;border:0;border-radius:6px}
</style></head><body><header><div class="id">REVBOO / CREATIVE OPERATIONS</div><h1>Find it. Name it. Improve it.</h1><p>One shared collection · Permanent IDs · Agent tags</p><p class="hint">Say: <strong>“RB-001, Ad Autopsy v3. Change the ending.”</strong><br>One concept ID across versions. Legacy “final” does not mean approved for launch.</p><a href="https://cryptouprise.github.io/revboo-library/">Existing video collection ↗</a></header><main><div class="controls"><input id="q" placeholder="Search ID, title, old filename, scene or notes"><select id="brand"><option value="">All collections</option></select><select id="agent"><option value="">All agents</option></select><select id="kind"><option value="">Ads + reusable clips</option><option>Ad</option><option>Clip</option></select></div><div id="count"></div><div id="grid" class="grid"></div></main><dialog id="player"><button id="close">Close</button><h2 id="ptitle"></h2><video id="video" controls playsinline></video></dialog><script>async function main(){
const [manifest, registry]=await Promise.all([fetch('manifest.json').then(r=>{if(!r.ok)throw Error('Manifest unavailable');return r.json()}),fetch('catalog/registry.json').then(r=>{if(!r.ok)throw Error('Registry unavailable');return r.json()})]);
const refs=new Map();registry.concepts.forEach(c=>c.assets.forEach(id=>refs.set(id,c)));
const DATA={assets:[...manifest.finals.map(a=>({...a,kind:'Ad'})),...manifest.clips.map(a=>({...a,kind:'Clip',title:a.name}))].map(a=>{const c=refs.get(a.id)||{};const r=registry.revision_records[a.id]||{};return {...a,concept_id:c.concept_id||'Unregistered',created_by:r.created_by||c.created_by||'Unknown',last_edited_by:r.last_edited_by||c.last_edited_by||'Unknown',agent_tags:r.agent_tags||c.agent_tags||[],history:r.history||c.history||[],version:a.version||'Source',launch_status:r.status||'Not assessed',aliases:c.aliases||[],poster:a.poster}})};
const assets=DATA.assets;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
[...new Set(assets.map(a=>a.brand))].sort().forEach(b=>{let o=document.createElement('option');o.value=b;o.textContent=b;$('brand').append(o)});$('brand').value='Revboo';[...new Set(assets.flatMap(a=>[a.created_by,a.last_edited_by,...a.agent_tags]))].sort().forEach(name=>{let o=document.createElement('option');o.value=name;o.textContent=name;$('agent').append(o)});
function draw(){let q=$('q').value.toLowerCase();let rows=assets.filter(a=>(!$('brand').value||a.brand===$('brand').value)&&(!$('kind').value||a.kind===$('kind').value)&&(!$('agent').value||[a.created_by,a.last_edited_by,...a.agent_tags].includes($('agent').value))&&JSON.stringify([a.concept_id,a.title,a.aliases,a.note,a.version,a.categories]).toLowerCase().includes(q));$('count').textContent=rows.length+' entries · '+new Set(rows.map(a=>a.concept_id)).size+' concept/clip IDs';$('grid').innerHTML=rows.map(a=>`<article class="card">${a.poster?`<img loading="lazy" src="https://cryptouprise.github.io/revboo-library/${esc(a.poster)}" alt="${esc(a.title)}">`:''}<div class="id">${esc(a.concept_id)}</div><h2>${esc(a.title)}</h2><div class="tag">${esc(a.brand)} · ${esc(a.kind)} · ${esc(a.version||'Source')} · ${esc(a.duration)}s</div><div class="tag">Created: ${esc(a.created_by)} · Edited: ${esc(a.last_edited_by)}</div><p class="note">${esc(a.note||'No source notes recorded.')}</p><div class="tag">Launch review: ${esc(a.launch_status)} · Legacy status: ${esc(a.status||'unspecified')}</div>${a.video?`<button class="play" data-id="${esc(a.id)}">Play video</button> <a href="${esc(a.video)}" target="_blank" rel="noopener">Open MP4 ↗</a>`:'<p>Private saved cut. Request by this concept ID.</p>'}<details><summary>Source identity & aliases</summary><p>${esc(a.id)}</p><p>${esc((a.aliases||[]).join(' • '))}</p><p>${esc(a.library_file_id||'Repository release reference')}</p><p>${esc(JSON.stringify(a.history))}</p></details></article>`).join('');document.querySelectorAll('.play').forEach(b=>b.onclick=()=>{let a=assets.find(a=>a.id===b.dataset.id);$('ptitle').textContent=a.concept_id+' · '+a.title;$('video').src=a.video;$('player').showModal();$('video').play().catch(()=>{})})};['q','brand','kind','agent'].forEach(id=>$(id).addEventListener('input',draw));$('close').onclick=()=>{$('video').pause();$('video').removeAttribute('src');$('player').close()};$('player').addEventListener('cancel',()=>{$('video').pause()});draw();} main().catch(e=>{document.getElementById("count").textContent="Catalog could not load: "+e.message});</script></body></html>
